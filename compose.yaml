name: destiny2report-backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Bungie__ApiKey: ${BUNGIE_API_KEY:-}
      Bungie__ClientId: ${BUNGIE_CLIENT_ID:-}
      Bungie__ClientSecret: ${BUNGIE_CLIENT_SECRET:-}
      Admin__MembershipTypeId: ${ADMIN_MEMBERSHIP_TYPE_ID:-0}
      Admin__MembershipId: ${ADMIN_MEMBERSHIP_ID:-0}
      WebPush__Subject: ${WEB_PUSH_SUBJECT:-}
      WebPush__PublicKey: ${WEB_PUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEB_PUSH_PRIVATE_KEY:-}
      ConnectionStrings__MongoDb: mongodb://mongo:27017
      ConnectionStrings__Redis: redis:6379
      OpenTelemetry__Endpoint: http://jaeger:4317
      OpenTelemetry__Protocol: Grpc
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  crawler-rust:
    build:
      context: .
      dockerfile: crawler-rs/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: Destiny2Report
      REDIS_URI: redis://redis:6379/
      BUNGIE_API_KEY: ${BUNGIE_API_KEY:-}
      CRAWLER__ORDINARY_REQUESTS_PER_SECOND_PER_INSTANCE: ${RUST_CRAWLER_ORDINARY_RPS:-20}
      CRAWLER__PGCR_REQUESTS_PER_SECOND_PER_INSTANCE: ${RUST_CRAWLER_PGCR_RPS:-50}
      CRAWLER__SHERPA_HISTORY_REQUESTS_PER_SECOND_PER_INSTANCE: ${RUST_CRAWLER_SHERPA_RPS:-20}
      CRAWLER__ORDINARY_RATE_LIMIT_QUEUE_LIMIT_PER_INSTANCE: ${RUST_CRAWLER_ORDINARY_QUEUE_LIMIT:-1000}
      CRAWLER__PGCR_RATE_LIMIT_QUEUE_LIMIT_PER_INSTANCE: ${RUST_CRAWLER_PGCR_QUEUE_LIMIT:-1000}
      CRAWLER__SHERPA_HISTORY_RATE_LIMIT_QUEUE_LIMIT_PER_INSTANCE: ${RUST_CRAWLER_SHERPA_QUEUE_LIMIT:-1000}
      CRAWLER__MAX_IN_FLIGHT_REQUESTS_PER_INSTANCE: ${RUST_CRAWLER_MAX_IN_FLIGHT:-32}
      CRAWLER__MAX_IN_FLIGHT_PGCRS_PER_INSTANCE: ${RUST_CRAWLER_MAX_IN_FLIGHT_PGCRS:-64}
      CRAWLER__MAX_BUFFERED_PGCRS: ${RUST_CRAWLER_MAX_BUFFERED_PGCRS:-128}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
    restart: unless-stopped

  mongo:
    image: mongo:8.3
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
