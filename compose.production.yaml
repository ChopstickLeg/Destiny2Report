name: destiny2report-backend

services:
  api:
    image: ${API_IMAGE:-destiny2report-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bungie__ApiKey: ${BUNGIE_API_KEY:?BUNGIE_API_KEY is required}
      Bungie__ClientId: ${BUNGIE_CLIENT_ID:?BUNGIE_CLIENT_ID is required}
      Bungie__ClientSecret: ${BUNGIE_CLIENT_SECRET:?BUNGIE_CLIENT_SECRET is required}
      Admin__MembershipTypeId: ${ADMIN_MEMBERSHIP_TYPE_ID:?ADMIN_MEMBERSHIP_TYPE_ID is required}
      Admin__MembershipId: ${ADMIN_MEMBERSHIP_ID:?ADMIN_MEMBERSHIP_ID is required}
      Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      Turnstile__AllowedHostnames__0: ${TURNSTILE_ALLOWED_HOSTNAME:-destiny-2.report}
      WebPush__Subject: ${WEB_PUSH_SUBJECT:?WEB_PUSH_SUBJECT is required}
      WebPush__PublicKey: ${WEB_PUSH_PUBLIC_KEY:?WEB_PUSH_PUBLIC_KEY is required}
      WebPush__PrivateKey: ${WEB_PUSH_PRIVATE_KEY:?WEB_PUSH_PRIVATE_KEY is required}
      ConnectionStrings__MongoDb: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017/?authSource=admin&replicaSet=rs0
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      OpenTelemetry__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required}
      OpenTelemetry__Protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:-Grpc}
      OpenTelemetry__Headers: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OpenTelemetry__AuthorizationHeader: ${OTEL_EXPORTER_OTLP_AUTHORIZATION_HEADER:-}
      OpenTelemetry__AuthorizationBearerToken: ${OTEL_EXPORTER_OTLP_BEARER_TOKEN:-}
      Crawler__BackgroundConcurrency: ${CRAWLER_BACKGROUND_CONCURRENCY:-2}
      RateLimiting__TrustedProxyNetworks__0: ${TRUSTED_PROXY_NETWORK:-10.0.0.0/8}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  crawler-rust:
    image: ${RUST_CRAWLER_IMAGE:-destiny2report-crawler-rust:latest}
    build:
      context: .
      dockerfile: crawler-rs/Dockerfile
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017/?authSource=admin&replicaSet=rs0
      MONGODB_DATABASE: Destiny2Report
      REDIS_URI: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/
      BUNGIE_API_KEY: ${BUNGIE_API_KEY:?BUNGIE_API_KEY is required}
      CRAWLER__ORDINARY_REQUESTS_PER_SECOND_PER_INSTANCE: ${RUST_CRAWLER_ORDINARY_RPS:-20}
      CRAWLER__PGCR_REQUESTS_PER_SECOND_PER_INSTANCE: ${RUST_CRAWLER_PGCR_RPS:-50}
      CRAWLER__SHERPA_HISTORY_REQUESTS_PER_SECOND_PER_INSTANCE: ${RUST_CRAWLER_SHERPA_RPS:-20}
      CRAWLER__ORDINARY_RATE_LIMIT_QUEUE_LIMIT_PER_INSTANCE: ${RUST_CRAWLER_ORDINARY_QUEUE_LIMIT:-1000}
      CRAWLER__PGCR_RATE_LIMIT_QUEUE_LIMIT_PER_INSTANCE: ${RUST_CRAWLER_PGCR_QUEUE_LIMIT:-1000}
      CRAWLER__SHERPA_HISTORY_RATE_LIMIT_QUEUE_LIMIT_PER_INSTANCE: ${RUST_CRAWLER_SHERPA_QUEUE_LIMIT:-1000}
      CRAWLER__MAX_IN_FLIGHT_REQUESTS_PER_INSTANCE: ${RUST_CRAWLER_MAX_IN_FLIGHT:-32}
      CRAWLER__MAX_IN_FLIGHT_PGCRS_PER_INSTANCE: ${RUST_CRAWLER_MAX_IN_FLIGHT_PGCRS:-64}
      CRAWLER__MAX_BUFFERED_PGCRS: ${RUST_CRAWLER_MAX_BUFFERED_PGCRS:-128}
      RUST_LOG: ${RUST_LOG:-info}
      OTEL_SERVICE_NAME: ${RUST_CRAWLER_OTEL_SERVICE_NAME:-Destiny2Report.Crawler}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_AUTHORIZATION_HEADER: ${OTEL_EXPORTER_OTLP_AUTHORIZATION_HEADER:-}
      OTEL_EXPORTER_OTLP_BEARER_TOKEN: ${OTEL_EXPORTER_OTLP_BEARER_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mongo:
    image: mongo:8.3
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        install -m 400 -o mongodb -g mongodb /run/secrets/mongo-replica-set-key /tmp/mongodb-keyfile
        && exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile
    secrets:
      - mongo-replica-set-key
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mongo-data:
  redis-data:

secrets:
  mongo-replica-set-key:
    file: ${MONGO_REPLICA_SET_KEY_FILE:?MONGO_REPLICA_SET_KEY_FILE is required}
