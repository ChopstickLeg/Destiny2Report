name: .NET CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: .NET Build and test
    # MongoDB 8 cannot start on the kernel shipped with Ubuntu 26.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_CACHE_TEST_URI: mongodb://localhost:27017

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Destiny2Report.sln

      - name: Check formatting
        run: dotnet format Destiny2Report.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Destiny2Report.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Destiny2Report.sln --configuration Release --no-build --logger "console;verbosity=normal"
